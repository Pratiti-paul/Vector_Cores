<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f5a"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fa8"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4541a"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker>
  </defs>
  <rect width="1440" height="660" fill="#ffffff"/>

  <text x="720" y="38" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">Vector Cores - Harvard vs Von Neumann Memory Organization</text>

  <!-- ===================== HARVARD ===================== -->
  <rect x="16" y="64" width="696" height="576" rx="10" fill="#f7faf9" stroke="#c9d6d0"/>
  <text x="36" y="98" font-size="18" font-weight="bold" fill="#1b7f5a">Harvard (top_module)</text>
  <text x="36" y="120" font-size="13" fill="#5b6670">Separate instruction and data memories, each with its own port and bus</text>

  <!-- Instruction memory -->
  <rect x="28" y="200" width="122" height="120" rx="6" fill="#dff3ea" stroke="#1b7f5a" stroke-width="2"/>
  <text x="89" y="236" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Instruction</text>
  <text x="89" y="255" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Memory</text>
  <text x="89" y="280" font-size="13" fill="#1f2933" text-anchor="middle">16 × 16 ROM</text>
  <text x="89" y="299" font-size="12" fill="#5b6670" text-anchor="middle">(program.hex)</text>

  <!-- Core -->
  <rect x="280" y="150" width="200" height="300" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="380" y="176" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Processor core</text>
  <g font-size="13" fill="#1f2933" text-anchor="middle">
    <rect x="300" y="190" width="160" height="36" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="380" y="213">Program Counter (4)</text>
    <rect x="300" y="236" width="160" height="36" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="380" y="259">Control Unit</text>
    <rect x="300" y="282" width="160" height="36" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="380" y="305">Register File 4 × 8</text>
    <rect x="300" y="328" width="160" height="36" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="380" y="351">ALU (8-bit)</text>
    <rect x="300" y="374" width="160" height="56" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="380" y="397">Next-PC logic</text><text x="380" y="416">Write-back mux</text>
  </g>

  <!-- Data memory -->
  <rect x="592" y="200" width="110" height="120" rx="6" fill="#dce8f6" stroke="#1d5fa8" stroke-width="2"/>
  <text x="647" y="236" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Data</text>
  <text x="647" y="255" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Memory</text>
  <text x="647" y="280" font-size="13" fill="#1f2933" text-anchor="middle">16 × 8 RAM</text>
  <text x="647" y="299" font-size="12" fill="#5b6670" text-anchor="middle">+ addr decoder</text>

  <!-- Instruction bus -->
  <line x1="280" y1="236" x2="153" y2="236" stroke="#1b7f5a" stroke-width="3" marker-end="url(#ag)"/>
  <text x="212" y="226" font-size="12" fill="#1b7f5a" text-anchor="middle">address (4)</text>
  <line x1="150" y1="284" x2="277" y2="284" stroke="#1b7f5a" stroke-width="3" marker-end="url(#ag)"/>
  <text x="208" y="274" font-size="12" fill="#1b7f5a" text-anchor="middle">instruction (16)</text>
  <text x="212" y="335" font-size="12" font-weight="bold" fill="#1b7f5a" text-anchor="middle">instruction bus</text>

  <!-- Data bus -->
  <line x1="480" y1="226" x2="589" y2="226" stroke="#1d5fa8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="530" y="216" font-size="12" fill="#1d5fa8" text-anchor="middle">address (4)</text>
  <line x1="480" y1="260" x2="589" y2="260" stroke="#1d5fa8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="530" y="250" font-size="12" fill="#1d5fa8" text-anchor="middle">write (8)</text>
  <line x1="592" y1="294" x2="483" y2="294" stroke="#1d5fa8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="530" y="284" font-size="12" fill="#1d5fa8" text-anchor="middle">read (8)</text>
  <text x="536" y="335" font-size="12" font-weight="bold" fill="#1d5fa8" text-anchor="middle">data bus</text>

  <!-- Harvard footer -->
  <rect x="36" y="490" width="656" height="126" rx="6" fill="#ffffff" stroke="#c9d6d0"/>
  <text x="52" y="518" font-size="14" font-weight="bold" fill="#1f2933">Every cycle: instruction fetch AND data access in parallel</text>
  <text x="52" y="544" font-size="13" fill="#1f2933">• All instructions, including LOAD/STORE, take 1 cycle (CPI = 1)</text>
  <text x="52" y="566" font-size="13" fill="#1f2933">• A STORE can never overwrite the program (separate memory)</text>
  <text x="52" y="588" font-size="13" fill="#1f2933">• iCE40 HX8K: 321 LUTs, 156 FFs, Fmax 63.86 MHz</text>
  <text x="52" y="606" font-size="12" fill="#5b6670">Cycles: program.hex 7, memory-heavy 10, compute loop 16</text>

  <!-- ===================== VON NEUMANN ===================== -->
  <rect x="728" y="64" width="696" height="576" rx="10" fill="#fdf8f4" stroke="#e2cdbd"/>
  <text x="748" y="98" font-size="18" font-weight="bold" fill="#b4541a">Von Neumann baseline (vn_top_module)</text>
  <text x="748" y="120" font-size="13" fill="#5b6670">Instructions and data share one memory through a single port</text>

  <!-- Core -->
  <rect x="800" y="140" width="420" height="170" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="1010" y="163" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Processor core (same PC, CU, RF, ALU)</text>
  <g font-size="13" fill="#1f2933" text-anchor="middle">
    <rect x="815" y="176" width="120" height="40" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="875" y="201">PC (4)</text>
    <rect x="950" y="176" width="120" height="40" rx="4" fill="#fbe6d6" stroke="#b4541a"/><text x="1010" y="194">FSM</text><text x="1010" y="210" font-size="11">FETCH / DATA</text>
    <rect x="1085" y="176" width="120" height="40" rx="4" fill="#fbe6d6" stroke="#b4541a"/><text x="1145" y="194">IR (16)</text><text x="1145" y="210" font-size="11">holds LOAD/STORE</text>
    <rect x="815" y="232" width="120" height="40" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="875" y="257">Control Unit</text>
    <rect x="950" y="232" width="120" height="40" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="1010" y="257">Register File</text>
    <rect x="1085" y="232" width="120" height="40" rx="4" fill="#eef1f4" stroke="#8a96a3"/><text x="1145" y="257">ALU</text>
  </g>
  <text x="1010" y="296" font-size="11" fill="#5b6670" text-anchor="middle">new: state flip-flop, instruction register, port arbitration, stall gating</text>

  <!-- Address mux -->
  <polygon points="900,368 1060,368 1036,410 924,410" fill="#fbe6d6" stroke="#b4541a" stroke-width="2"/>
  <text x="980" y="394" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">address mux</text>
  <line x1="930" y1="310" x2="930" y2="366" stroke="#b4541a" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="922" y="342" font-size="12" fill="#b4541a" text-anchor="end">FETCH: {0, PC}</text>
  <line x1="1020" y1="310" x2="1020" y2="366" stroke="#b4541a" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="1028" y="336" font-size="12" fill="#b4541a">DATA: {1, IR[9:6]}</text>
  <line x1="1170" y1="310" x2="1170" y2="389" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1170" y1="389" x2="1050" y2="389" stroke="#5b6670" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ak)"/>
  <text x="1110" y="380" font-size="11" fill="#5b6670" text-anchor="middle">select = state</text>

  <!-- Mux to memory -->
  <line x1="980" y1="410" x2="980" y2="444" stroke="#b4541a" stroke-width="3" marker-end="url(#ao)"/>
  <text x="994" y="432" font-size="12" fill="#b4541a">address (5)</text>

  <!-- Unified memory -->
  <rect x="840" y="446" width="340" height="104" rx="6" fill="#fbe6d6" stroke="#b4541a" stroke-width="2"/>
  <text x="1010" y="472" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Unified Memory 32 × 16 - single port</text>
  <text x="860" y="498" font-size="13" fill="#1f2933">0x00-0x0F  instructions (program.hex, write-protected)</text>
  <text x="860" y="520" font-size="13" fill="#1f2933">0x10-0x1F  data (bits [7:0])</text>
  <text x="860" y="540" font-size="12" fill="#5b6670">one access per cycle: fetch OR data</text>

  <!-- Read data back to core -->
  <polyline points="840,498 772,498 772,252 797,252" fill="none" stroke="#b4541a" stroke-width="3" marker-end="url(#ao)"/>
  <text x="762" y="375" font-size="12" fill="#b4541a" text-anchor="middle" transform="rotate(-90 762 375)">read (16): instruction OR data</text>
  <!-- Write data to memory -->
  <polyline points="1220,252 1250,252 1250,520 1183,520" fill="none" stroke="#b4541a" stroke-width="3" marker-end="url(#ao)"/>
  <text x="1262" y="386" font-size="12" fill="#b4541a" text-anchor="middle" transform="rotate(90 1262 386)">write (STORE data)</text>
  <text x="1340" y="300" font-size="13" font-weight="bold" fill="#b4541a" text-anchor="middle">one shared</text>
  <text x="1340" y="318" font-size="13" font-weight="bold" fill="#b4541a" text-anchor="middle">bus / port</text>

  <!-- VN footer -->
  <rect x="748" y="566" width="656" height="64" rx="6" fill="#ffffff" stroke="#e2cdbd"/>
  <text x="764" y="590" font-size="13" fill="#1f2933">• LOAD/STORE take 2 cycles (fetch, then data access); CPI = 1 + M/N</text>
  <text x="764" y="612" font-size="13" fill="#1f2933">• iCE40 HX8K: 571 LUTs, 301 FFs, Fmax 37.69 MHz  •  cycles: 9 / 17 / 16</text>
</svg>
